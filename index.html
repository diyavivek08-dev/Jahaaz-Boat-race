<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAHAAZ - Challenge Portal</title>
  <style>
    :root {
      --bg-dark: #030f1e;
      --card-bg: rgba(7, 26, 49, 0.88);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-light: #e0f7fa;
      --hover-glow: rgba(0, 242, 254, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #072142 0%, #030f1e 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0, 242, 254, 0.05) 0%, transparent 80%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 242, 254, 0.15);
      padding: 40px;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    header {
      margin-bottom: 35px;
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 6px;
      color: var(--accent-cyan);
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
    }

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
