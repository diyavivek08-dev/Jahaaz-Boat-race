<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAHAAZ - Checkpoint Portal</title>
  <style>
    :root {
      --bg-dark: #030f1e;
      --card-bg: rgba(7, 26, 49, 0.88);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-light: #e0f7fa;
      --hover-glow: rgba(0, 242, 254, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #072142 0%, #030f1e 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(0, 242, 254, 0.05) 0%, transparent 80%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 242, 254, 0.15);
      padding: 40px;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    header {
      margin-bottom: 35px;
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 6px;
      color: var(--accent-cyan);
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .checkpoint-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .checkpoint-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 12px;
      padding: 22px 18px;
      text-decoration: none;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .checkpoint-card:hover {
      transform: translateY(-5px);
      background: rgba(0, 242, 254, 0.12);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 20px var(--hover-glow);
    }

    .cp-num {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .cp-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .reset-btn {
      margin-top: 35px;
      padding: 12px 24px;
      background: transparent;
      border: 1px solid rgba(255, 82, 82, 0.4);
      color: #ff5252;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-btn:hover {
      background: rgba(255, 82, 82, 0.15);
      border-color: #ff5252;
    }

    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>JAHAAZ</h1>
      <div class="subtitle">Checkpoint Navigation Portal</div>
    </header>

    <div class="checkpoint-grid">
      <a href="checkpoint1.html" class="checkpoint-card">
        <div class="cp-num">Checkpoint 1</div>
        <div class="cp-title">Physics</div>
      </a>

      <a href="checkpoint2.html" class="checkpoint-card">
        <div class="cp-num">Checkpoint 2</div>
        <div class="cp-title">Maths</div>
      </a>

      <a href="checkpoint3.html" class="checkpoint-card">
        <div class="cp-num">Checkpoint 3</div>
        <div class="cp-title">Logic & Coding</div>
      </a>

      <a href="checkpoint4.html" class="checkpoint-card">
        <div class="cp-num">Checkpoint 4</div>
        <div class="cp-title">Sports & GK</div>
      </a>

      <a href="checkpoint5.html" class="checkpoint-card">
        <div class="cp-num">Checkpoint 5</div>
        <div class="cp-title">Chemistry</div>
      </a>

      <a href="checkpoint6.html" class="checkpoint-card">
        <div class="cp-num">Checkpoint 6</div>
        <div class="cp-title">Random (All)</div>
      </a>
    </div>

    <button class="reset-btn" onclick="resetAllHistory()">Reset Question Tracking Data</button>

    <footer>Select a checkpoint or scan a QR code to launch a question</footer>
  </div>

  <script>
    function resetAllHistory() {
      if (confirm("Are you sure you want to reset question history across all checkpoints? Previously asked questions will become available again.")) {
        const subjects = ['physics', 'maths', 'logicCoding', 'sportsGK', 'chemistry'];
        subjects.forEach(sub => localStorage.removeItem('jahaaz_used_' + sub));
        alert("Question tracking reset successfully!");
      }
    }
  </script>

</body>
</html>
